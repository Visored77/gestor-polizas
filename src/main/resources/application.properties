spring.application.name=gestor-polizas

# Conexion a MySQL (contenedor podman mi-mysql)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gestion_polizas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# validate: valida que el esquema coincida con las entidades, sin modificar las tablas existentes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Puerto del servidor
server.port=8080

# Seguridad del mock del CORE: clave requerida en el header x-api-key
api.key=123456

# Cliente HTTP hacia el mock del CORE (la propia app expone /core-mock/evento)
core.mock.base-url=http://localhost:8080
